services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes: ["mlflow:/mlflow"]
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 20

  train:
    build: .
    command: python train.py
    environment: {MLFLOW_TRACKING_URI: "http://mlflow:5000"}
    depends_on: {mlflow: {condition: service_healthy}}
    profiles: ["train"]   # one-off job: docker compose run --rm train

  api:
    build: .
    environment: {MLFLOW_TRACKING_URI: "http://mlflow:5000"}
    depends_on: {mlflow: {condition: service_healthy}}
    ports: ["8000:8000"]
    restart: unless-stopped   # waits for a model to be registered

volumes:
  mlflow:
